<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 480" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-label="NETWRAITH architecture and data flow">
  <rect width="1240" height="480" fill="#0a0a0c"/>

  <!-- faint surveying grid -->
  <g stroke="#71717a" stroke-opacity="0.05">
    <path d="M0 80H1240M0 160H1240M0 240H1240M0 320H1240M0 400H1240"/>
    <path d="M120 0V480M240 0V480M360 0V480M480 0V480M600 0V480M720 0V480M840 0V480M960 0V480M1080 0V480M1200 0V480"/>
  </g>

  <!-- title -->
  <rect x="36" y="34" width="3" height="17" fill="#6366f1"/>
  <text x="50" y="48" fill="#e4e4e7" font-size="16" font-weight="600" letter-spacing="4">NETWRAITH</text>
  <text x="186" y="48" fill="#52525b" font-size="12.5" letter-spacing="1">architecture, left to right</text>
  <text x="1204" y="48" fill="#3f3f46" font-size="11" text-anchor="end">it watches the wire so you do not have to</text>

  <!-- arrows (drawn first so boxes sit on top) -->
  <g stroke="#6366f1" stroke-width="1.4" fill="#6366f1">
    <path d="M196 225H236"/><path d="M236 225l-7 -4v8z"/>
    <path d="M506 225H548"/><path d="M548 225l-7 -4v8z"/>
    <path d="M716 225H758"/><path d="M758 225l-7 -4v8z"/>
    <path d="M976 225H1024"/><path d="M1024 225l-7 -4v8z"/>
  </g>
  <g fill="#71717a" font-size="10.5" text-anchor="middle" letter-spacing="0.5">
    <text x="216" y="214">frames</text>
    <text x="527" y="214">alerts</text>
    <text x="737" y="214">tail</text>
    <text x="1000" y="214">/api</text>
  </g>

  <!-- STAGE 1: the wire -->
  <g>
    <rect x="36" y="150" width="160" height="150" fill="#0e0e11" stroke="#27272a"/>
    <rect x="36" y="150" width="160" height="2" fill="#3f3f46"/>
    <text x="52" y="180" fill="#a1a1aa" font-size="11" letter-spacing="2">SOURCE</text>
    <text x="52" y="206" fill="#e4e4e7" font-size="13.5" font-weight="600">The wire</text>
    <text x="52" y="232" fill="#71717a" font-size="10.5">live interface</text>
    <text x="52" y="248" fill="#71717a" font-size="10.5">or pcap replay</text>
    <rect x="52" y="266" width="62" height="18" fill="#18181b" stroke="#27272a"/>
    <text x="83" y="279" fill="#a1a1aa" font-size="10" text-anchor="middle">libpcap</text>
  </g>

  <!-- STAGE 2: engine -->
  <g>
    <rect x="256" y="150" width="250" height="150" fill="#0d0d10" stroke="#3a3a55"/>
    <rect x="256" y="150" width="250" height="2" fill="#6366f1"/>
    <text x="272" y="178" fill="#818cf8" font-size="11" letter-spacing="2">ENGINE</text>
    <text x="494" y="178" fill="#52525b" font-size="10.5" text-anchor="end">C++17</text>
    <g font-size="11">
      <rect x="272" y="190" width="218" height="26" fill="#131318" stroke="#27272a"/>
      <text x="282" y="207" fill="#e4e4e7">parser</text>
      <text x="482" y="207" fill="#71717a" font-size="9.5" text-anchor="end">ipv4, tcp / udp / icmp</text>
      <rect x="272" y="220" width="218" height="26" fill="#131318" stroke="#27272a"/>
      <text x="282" y="237" fill="#e4e4e7">detector</text>
      <text x="482" y="237" fill="#71717a" font-size="9.5" text-anchor="end">rules, scan, flood, sweep</text>
      <rect x="272" y="250" width="218" height="26" fill="#131318" stroke="#27272a"/>
      <text x="282" y="267" fill="#e4e4e7">emitter</text>
      <text x="482" y="267" fill="#71717a" font-size="9.5" text-anchor="end">hand rolled json</text>
    </g>
    <text x="272" y="292" fill="#52525b" font-size="9.5">capture and worker threads</text>
  </g>

  <!-- STAGE 3: jsonl file -->
  <g>
    <path d="M566 162 h104 l20 20 v118 h-124 z" fill="#0e0e11" stroke="#27272a"/>
    <path d="M670 162 v20 h20 z" fill="#18181b" stroke="#27272a"/>
    <text x="582" y="206" fill="#e4e4e7" font-size="12.5" font-weight="600">netwraith</text>
    <text x="582" y="223" fill="#e4e4e7" font-size="12.5" font-weight="600">.jsonl</text>
    <text x="582" y="250" fill="#71717a" font-size="10">JSON Lines</text>
    <text x="582" y="266" fill="#71717a" font-size="10">one alert per</text>
    <text x="582" y="280" fill="#71717a" font-size="10">line, appended</text>
  </g>

  <!-- STAGE 4: bridge -->
  <g>
    <rect x="758" y="150" width="218" height="150" fill="#0e0e11" stroke="#27272a"/>
    <rect x="758" y="150" width="218" height="2" fill="#3f3f46"/>
    <text x="774" y="178" fill="#a1a1aa" font-size="11" letter-spacing="2">BRIDGE</text>
    <text x="962" y="178" fill="#52525b" font-size="10.5" text-anchor="end">Node</text>
    <g font-size="11">
      <rect x="774" y="190" width="186" height="26" fill="#131318" stroke="#27272a"/>
      <text x="784" y="207" fill="#e4e4e7">tail</text>
      <text x="952" y="207" fill="#71717a" font-size="9.5" text-anchor="end">follows appended lines</text>
      <rect x="774" y="220" width="186" height="26" fill="#131318" stroke="#27272a"/>
      <text x="784" y="237" fill="#e4e4e7">ring buffer</text>
      <text x="952" y="237" fill="#71717a" font-size="9.5" text-anchor="end">recent 500</text>
      <rect x="774" y="250" width="186" height="26" fill="#131318" stroke="#27272a"/>
      <text x="784" y="267" fill="#e4e4e7">rest</text>
      <text x="952" y="267" fill="#71717a" font-size="9.5" text-anchor="end">/api/alerts, /api/stats</text>
    </g>
    <text x="774" y="292" fill="#52525b" font-size="9.5">cors for localhost</text>
  </g>

  <!-- STAGE 5: dashboard -->
  <g>
    <rect x="1024" y="150" width="180" height="150" fill="#0d0d10" stroke="#3a3a55"/>
    <rect x="1024" y="150" width="180" height="2" fill="#6366f1"/>
    <text x="1040" y="178" fill="#818cf8" font-size="11" letter-spacing="2">DASHBOARD</text>
    <text x="1040" y="204" fill="#e4e4e7" font-size="13" font-weight="600">Next.js console</text>
    <text x="1040" y="228" fill="#71717a" font-size="10.5">snapshot, refreshed</text>
    <text x="1040" y="244" fill="#71717a" font-size="10.5">on demand</text>
    <g font-size="9.5" fill="#a1a1aa">
      <rect x="1040" y="258" width="58" height="17" fill="#18181b" stroke="#27272a"/>
      <text x="1069" y="270" text-anchor="middle">filters</text>
      <rect x="1104" y="258" width="50" height="17" fill="#18181b" stroke="#27272a"/>
      <text x="1129" y="270" text-anchor="middle">sort</text>
    </g>
  </g>

  <!-- footer legend -->
  <text x="36" y="356" fill="#52525b" font-size="11">
    The engine writes JSON Lines. The bridge tails the file and serves it over REST. The dashboard reads a snapshot and lets an operator work it.
  </text>
  <g font-size="10" fill="#71717a">
    <rect x="36" y="378" width="10" height="10" fill="#818cf8"/>
    <text x="54" y="387">indigo marks the two products you run and the path between them</text>
    <rect x="470" y="378" width="10" height="10" fill="#27272a" stroke="#3f3f46"/>
    <text x="488" y="387">zinc marks plumbing: the source, the file, the relay</text>
  </g>
</svg>
